name: Publish Stable Cyclus

on:
  pull_request:
    paths:
      - '.github/workflows/publish_release.yml'
  release:
    types: [released]

jobs:
  build-test-publish-release-img:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    name: Publish Release
    steps:
      - name: Tag as ci-image-cache
        run: |
          echo "version_tag=ci-image-cache" >> "$GITHUB_ENV"
          echo "stable_tag=ci-image-cache" >> "$GITHUB_ENV"

      - name: Tag as stable
        if: ${{ github.repository_owner == 'cyclus' && github.event_name == 'release' }}
        run: |
          echo "version_tag=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          echo "stable_tag=stable" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Cyclus
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image has the test environment of the Pixi workspace, as it is for
      # building and testing the projects that depend on Cyclus.
      - name: Build and Test Cyclus
        uses: docker/build-push-action@v5
        with:
          cache-from: type=registry,ref=ghcr.io/cyclus/cyclus:ci-layer-cache
          file: docker/Dockerfile
          target: test
          build-args: |
            ENVIRONMENT=test

      # This reuses the layers of the previous step from the builder's cache.
      # The image is only pushed for a release of the cyclus organization.
      # Otherwise it is only built.
      - name: Build and Push Cyclus
        uses: docker/build-push-action@v5
        with:
          cache-from: type=registry,ref=ghcr.io/cyclus/cyclus:ci-layer-cache
          file: docker/Dockerfile
          push: ${{ github.repository_owner == 'cyclus' && github.event_name == 'release' }}
          tags: |
            ghcr.io/cyclus/cyclus:${{ env.version_tag }}
            ghcr.io/cyclus/cyclus:${{ env.stable_tag }}
          build-args: |
            ENVIRONMENT=test
