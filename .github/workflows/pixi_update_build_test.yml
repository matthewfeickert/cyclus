name: Pixi Update Build/Test Cyclus

on:
  # allows us to run workflows manually
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '.github/workflows/publish_latest.yml'
      - '.github/workflows/publish_release.yml'
      - '.github/workflows/changelog_test.yml'
      - '.github/workflows/rocky_build_test.yml'
      - '.github/workflows/minimum_build_test.yml'
      - '.github/workflows/build_test.yml'
      - '.github/workflows/conda_build_test.yml'
      - 'doc/**'
      - 'CHANGELOG.rst'
  push:
    paths-ignore:
      - '.github/workflows/publish_latest.yml'
      - '.github/workflows/publish_release.yml'
      - '.github/workflows/changelog_test.yml'
      - '.github/workflows/rocky_build_test.yml'
      - '.github/workflows/minimum_build_test.yml'
      - '.github/workflows/build_test.yml'
      - '.github/workflows/conda_build_test.yml'
      - 'doc/**'
      - 'CHANGELOG.rst'

# Cancel an in-progress run when a newer commit is pushed to the same branch
# or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds Cyclus in the Pixi workspace after updating its dependencies to
  # their latest versions that pixi.toml allows, rather than those of
  # pixi.lock. The downstream Cycamore and Cymetric builds are done here, as
  # dependencies that only they need (e.g. matplotlib) can be added to the
  # updated environment without changing pixi.toml. Cyclus is always built
  # with --allow-milps, as Cycamore is built with --allow-milps and so needs
  # Cyclus to have COIN.
  build-test-pixi-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cyclus
        uses: actions/checkout@v7

      # The environment is installed by 'pixi run' after the update, as it is
      # not that of pixi.lock.
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          run-install: false

      - name: Update the Pixi environment
        run: |
          # Cymetric depends on matplotlib
          pixi add --feature test --no-install matplotlib
          pixi update --no-install --environment test
          pixi list --environment test

      - name: Build Cyclus
        id: build-cyclus
        run: pixi run -e test build -j "$(nproc)" --allow-milps --parallel

      - name: Run unit tests
        run: pixi run -e test test-unit

      - name: Run Python tests
        run: pixi run -e test test-python

      - name: Checkout Cycamore
        if: ${{ github.event_name == 'pull_request' && steps.build-cyclus.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          repository: cyclus/cycamore
          path: cycamore

      # Cycamore is installed into the install prefix of Cyclus, as its CMake
      # configuration loads the Cyclus CMake modules from there.
      - name: Build and Test Cycamore
        id: build-cycamore
        if: ${{ github.event_name == 'pull_request' && steps.build-cyclus.outcome == 'success' }}
        continue-on-error: true
        shell: pixi run --manifest-path ../pixi.toml -e test bash -e {0}
        working-directory: cycamore
        run: |
          python install.py --prefix "${CYCLUS_INSTALL_PREFIX}" -j "$(nproc)" --allow-milps
          cycamore_unit_tests
          cd tests && python -m pytest

      - name: Checkout Cymetric
        if: ${{ github.event_name == 'pull_request' && steps.build-cycamore.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          repository: cyclus/cymetric
          path: cymetric

      - name: Build and Test Cymetric
        id: build-cymetric
        if: ${{ github.event_name == 'pull_request' && steps.build-cycamore.outcome == 'success' }}
        continue-on-error: true
        shell: pixi run --manifest-path ../pixi.toml -e test bash -e {0}
        working-directory: cymetric
        run: |
          python -m pip install --target "$(python -m site --user-site)" --no-deps .
          cd tests && python -m pytest

      - name: Export Environment Variables
        if: github.event_name == 'pull_request'
        run: |
          echo "CYCAMORE_BUILD_STATUS=${{steps.build-cycamore.outcome == 'success' && '**Success** :white_check_mark:' || 
          steps.build-cycamore.outcome == 'failure' && '**Failure** :x:' || 
          '**Skipped due to upstream failure** :warning:'}}" >> "$GITHUB_ENV"

          echo "CYMETRIC_BUILD_STATUS=${{steps.build-cymetric.outcome == 'success' && '**Success** :white_check_mark:' || 
          steps.build-cymetric.outcome == 'failure' && '**Failure** :x:' || 
          '**Skipped due to upstream failure** :warning:'}}" >> "$GITHUB_ENV"

          echo "ARTIFACT_NAME=pixi_update" >> "$GITHUB_ENV"

      - name: Construct Artifact
        if: github.event_name == 'pull_request'
        run: |
          echo "
          ##### Build with updated Pixi environment
            - Cycamore: ${{ env.CYCAMORE_BUILD_STATUS }}
            - Cymetric: ${{ env.CYMETRIC_BUILD_STATUS }}" > ${{ env.ARTIFACT_NAME }}.txt
      
      - name: Upload Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.txt

  upload-pr-number:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout cyclus
        uses: actions/checkout@v4

      - name: Save PR number and Commit hash to file
        run: |
          echo "${{ github.event.number }}" > pr_number
          echo "${{ github.event.pull_request.head.sha }} - $(git log -1 --format=%ci)" > commit_hash_timestamp
      
      - name: Upload PR number artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr_number
          path: pr_number
      
      - name: Upload Commit hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: commit_hash_timestamp
          path: commit_hash_timestamp
