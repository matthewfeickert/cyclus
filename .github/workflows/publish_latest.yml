name: Publish Latest Cyclus

on:
  # allows us to run workflows manually
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/publish_latest.yml'
      - 'docker/**'
  push:
    branches:
      - main

jobs:
  build-test-publish-img:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    name: Publish Latest
    steps:
      - name: Tag as ci-image-cache
        run: |
          echo "tag=ci-image-cache" >> "$GITHUB_ENV"

      - name: Tag as latest
        if: ${{ github.repository_owner == 'cyclus' && github.ref == 'refs/heads/main' }}
        run: |
          echo "tag=latest" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Cyclus
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image has the test environment of the Pixi workspace, as it is for
      # building and testing the projects that depend on Cyclus.
      - name: Build and Test Cyclus
        uses: docker/build-push-action@v5
        with:
          cache-from: type=registry,ref=ghcr.io/cyclus/cyclus:ci-layer-cache
          file: docker/Dockerfile
          target: test
          build-args: |
            ENVIRONMENT=test

      # This reuses the layers of the previous step from the builder's cache.
      # The image and the layer cache are only pushed from the cyclus
      # organization and not for pull requests, as the token of a pull request
      # from a fork cannot write packages. Otherwise the image is only built.
      - name: Build and Push Cyclus
        uses: docker/build-push-action@v5
        with:
          cache-from: type=registry,ref=ghcr.io/cyclus/cyclus:ci-layer-cache
          cache-to: ${{ github.repository_owner == 'cyclus' && github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/cyclus/cyclus:ci-layer-cache,mode=max' || '' }}
          file: docker/Dockerfile
          push: ${{ github.repository_owner == 'cyclus' && github.event_name != 'pull_request' }}
          tags: ghcr.io/cyclus/cyclus:${{ env.tag }}
          build-args: |
            ENVIRONMENT=test
