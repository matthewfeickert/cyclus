name: Conda Build/Test Cyclus

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/conda_build_test.yml"
  push:
    paths:
      - ".github/workflows/conda_build_test.yml"
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds Cyclus in a conda environment that is solved at run time from
  # conda-forge, rather than in the Pixi workspace. The conda is installed with
  # Pixi, and so no container is needed.
  build-test-conda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cyclus
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          run-install: false

      - name: Install conda
        run: pixi global install conda

      - name: Create conda environment
        run: |
          conda create --yes --quiet --name cyclus \
            --override-channels --channel conda-forge \
            compilers \
            cmake \
            make \
            glib \
            libxml2-devel \
            "libxmlpp-devel>=4.0.2,<5" \
            liblapack \
            pkg-config \
            coincbc \
            libboost-devel \
            hdf5 \
            sqlite \
            pcre \
            python \
            libpython \
            setuptools \
            pytest \
            pytables \
            pandas \
            jinja2 \
            cython \
            websockets \
            pprintpp \
            pip
          conda list --name cyclus
          # Cyclus installs into ~/.local by default
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # 'conda run' activates the environment, which sets the compilers (CC,
      # CXX, etc.) for the build.
      - name: Build Cyclus
        shell: conda run --live-stream --name cyclus bash -e {0}
        run: |
          # The install step that symlinks the Cython modules into the user
          # site does not create it.
          mkdir -p "$(python -m site --user-site)"
          python install.py -j "$(nproc)" --allow-milps --parallel

      - name: Run unit tests
        shell: conda run --live-stream --name cyclus bash -e {0}
        run: cyclus_unit_tests

      - name: Run Python tests
        shell: conda run --live-stream --name cyclus bash -e {0}
        working-directory: tests
        run: python -m pytest
