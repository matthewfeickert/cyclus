name: Code Coverage

on:
  # allows us to run workflows manually
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '.github/workflows/build_test.yml'
      - '.github/workflows/publish_latest.yml'
      - '.github/workflows/publish_release.yml'
      - '.github/workflows/changelog_test.yml'
      - 'docker/**'
      - 'doc/**'
      - 'CHANGELOG.rst'
  push:
    branches:
      - main

# Cancel an in-progress run when a newer commit is pushed to the same branch
# or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    name: Build, Test, Report Coverage
    steps:
      - name: Checkout Cyclus
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true
          environments: coverage
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Build Cyclus
        run: pixi run -e coverage build -j "$(nproc)" --allow-milps --parallel --code-coverage

      - name: Capture initial coverage
        run: pixi run -e coverage coverage-initial

      - name: Run unit tests
        run: pixi run -e coverage test-unit

      - name: Run Python tests
        run: pixi run -e coverage test-python

      - name: Report coverage
        run: pixi run -e coverage coverage-report

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: ${{ github.workspace }}/total_coverage.info
          format: lcov

      - name: Upload Coverage HTML Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: cyclus-coverage-report
          path: ${{ github.workspace }}/html
