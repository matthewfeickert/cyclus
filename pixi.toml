[workspace]
name = "cyclus"
description = "Development environment for building and testing Cyclus"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
# Build tools
c-compiler = ">=2.0.0,<3"
cxx-compiler = ">=2.0.0,<3"
cmake = ">=4.4.3,<5"
make = ">=4.4.1,<5"
pkg-config = ">=0.29.2,<0.30"
git = ">=2.55.0,<3"
# C++ library dependencies
# Boost 1.89 removed the compiled Boost.System stub library that
# CMakeLists.txt still requests as a required component.
libboost-devel = ">=1.88.0,<1.89"
coincbc = ">=2.10.13,<3"
glib = ">=2.90.0,<3"
hdf5 = ">=2.2.0,<3"
liblapack = ">=3.11.0,<4"
libxml2 = ">=2.13.9,<3"
"libxmlpp-4.0" = ">=4.0.2,<5"
pcre = ">=8.45,<9"
sqlite = ">=3.53.4,<4"
# Python dependencies
python = "3.12.*"
# Cython 3.1 removed support for parts of the Python 2 era API that the
# Cyclus Cython sources still use.
cython = ">=3.0.0,<3.1.0"
jinja2 = ">=3.1.6,<4"
pandas = ">=3.0.6,<4"
pip = ">=26.2.1,<27"
pprintpp = ">=0.4.0,<0.5"
setuptools = ">=84.0.0,<85"
websockets = ">=17.2,<18"

[target.osx.dependencies]
# Clang does not ship an OpenMP runtime, which is needed for --parallel builds
llvm-openmp = ">=23.1.2,<24"
# libxmlpp-4.0 requires libxml2 <2.14, which restricts the solve to LLVM 21.1.0.
# The clang 21.1.0 package predates conda-forge's clang depending on its own
# linker, so without these clang falls back to the Xcode linker, which rejects
# conda-forge's LTO plugin ("-lto_library library filename must be
# 'libLTO.dylib'"). These can be removed once the environment solves to
# clang >=21.1.8, which depends on both itself.
# c.f. https://github.com/cyclus/cyclus/issues/1977
cctools = ">=1024.3,<1025"
ld64 = ">=955.13,<956"

[target.osx.activation.env]
# The conda-forge clang packages do not provide cc, c++, or cpp, so without
# these CMake and cycpp.py would use the Xcode toolchain instead.
CC = "clang"
CXX = "clang++"
CPP = "clang-cpp"
# The shared libraries are linked with -flat_namespace, which makes the linker
# load the dependencies of the libraries being linked against. Some of those
# are referenced through @rpath (e.g. libquadmath from libgfortran) and are
# only found if the environment's library directory is searched.
LDFLAGS = "-L$CONDA_PREFIX/lib"
